            children: null
          context:
            type: string
            children: null
          my_reply_count:
            type: number
            children: null
          masked_count:
            type: number
            children: null
      height: 90
      id: n_render
      position:
        x: 334
        y: 300
      positionAbsolute:
        x: 334
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 没有我方回复或输入不合法时不调用模型
        selected: false
        title: 有我方回复吗
        type: if-else
        cases:
